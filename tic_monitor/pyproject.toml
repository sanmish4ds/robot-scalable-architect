[project]
name = "tic-monitor"
version = "0.1.0"
description = "Reference TIC monitor + CAAI supervisor (no ROS 2 required)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sanjay Mishra" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "pydantic>=2.6",
]

[project.scripts]
tic-monitor = "tic_monitor.cli:main"

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tic_monitor"]

